project_id = "bloomup"

[auth]
enabled = true
site_url = "https://bloomup-rust.vercel.app"
additional_redirect_urls = [
  "https://bloomup-rust.vercel.app/**",
  "http://localhost:5173/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
